<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">

  <title>Mpa AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 15, 25, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #252b3a;
      padding: 14px 15px;
    }

    .header-inner {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #6c5ce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .brand-text h1 {
      font-size: 19px;
    }

    .brand-text p {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 3px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .header-button {
      background: #151b28;
      border: 1px solid #30384a;
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .header-button:hover {
      background: #20283a;
    }

    .chat {
      max-width: 850px;
      margin: auto;
      padding: 25px 15px 145px;
    }

    .welcome {
      text-align: center;
      padding: 70px 15px 35px;
    }

    .welcome-icon {
      width: 70px;
      height: 70px;
      margin: auto auto 20px;
      border-radius: 22px;
      background: #6c5ce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .welcome h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9ca3af;
      line-height: 1.6;
      max-width: 500px;
      margin: auto;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
      gap: 10px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      background: #6c5ce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .user .avatar {
      order: 2;
      background: #252b3a;
    }

    .message {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai .message {
      background: #151b28;
      border: 1px solid #252b3a;
      border-top-left-radius: 5px;
    }

    .user .message {
      background: #6c5ce7;
      border-top-right-radius: 5px;
    }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(11, 15, 25, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid #252b3a;
      padding: 12px 15px 15px;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #151b28;
      border: 1px solid #30384a;
      border-radius: 17px;
      padding: 7px;
    }

    textarea {
      flex: 1;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      resize: none;
      padding: 10px;
      font-size: 16px;
      line-height: 1.5;
      max-height: 130px;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .send-button {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      border: none;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      font-size: 19px;
    }

    .send-button:disabled {
      opacity: 0.5;
    }

    .hint {
      max-width: 850px;
      margin: 7px auto 0;
      text-align: center;
      color: #6b7280;
      font-size: 11px;
    }

    /* History */

    .history-panel {
      position: fixed;
      top: 0;
      left: -310px;
      width: 290px;
      height: 100vh;
      background: #101522;
      border-right: 1px solid #252b3a;
      z-index: 50;
      transition: left 0.25s ease;
      padding: 18px;
      overflow-y: auto;
    }

    .history-panel.open {
      left: 0;
    }

    .history-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .history-title h2 {
      font-size: 19px;
    }

    .close-history {
      background: transparent;
      color: white;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    .history-new {
      width: 100%;
      padding: 11px;
      border: 1px solid #30384a;
      background: #151b28;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .history-item {
      width: 100%;
      text-align: left;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid transparent;
      background: #151b28;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      border-color: #30384a;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
    }

    .overlay.show {
      display: block;
    }

    @media (max-width: 600px) {

      .brand-text h1 {
        font-size: 17px;
      }

      .message {
        max-width: 84%;
      }

      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }

      .history-panel {
        width: 280px;
      }
    }
  </style>
</head>

<body>

  <div class="overlay" id="overlay" onclick="closeHistory()"></div>

  <aside class="history-panel" id="historyPanel">

    <div class="history-title">
      <h2>💬 Chat History</h2>

      <button class="close-history" onclick="closeHistory()">
        ×
      </button>
    </div>

    <button class="history-new" onclick="newChat()">
      + New Chat
    </button>

    <div id="historyList"></div>

  </aside>


  <header>

    <div class="header-inner">

      <div class="brand">

        <div class="logo">
          🤖
        </div>

        <div class="brand-text">
          <h1>Mpa AI</h1>
          <p>AI yawe • Kinyarwanda • English • Swahili</p>
        </div>

      </div>

      <div class="header-buttons">

        <button
          class="header-button"
          onclick="openHistory()"
        >
          ☰
        </button>

        <button
          class="header-button"
          onclick="newChat()"
        >
          + New Chat
        </button>

      </div>

    </div>

  </header>


  <main class="chat" id="chat">

    <div class="welcome" id="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h2>Murakaza neza kuri Mpa AI</h2>

      <p>
        Baza ikibazo cyawe. Mpa AI ishobora kuganira nawe
        mu Kinyarwanda, English cyangwa Swahili.
      </p>

    </div>

  </main>


  <div class="input-area">

    <div class="input-box">

      <textarea
        id="question"
        rows="1"
        placeholder="Andika ikibazo hano..."
        onkeydown="handleKeyDown(event)"
      ></textarea>

      <button
        class="send-button"
        id="sendButton"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

    <div class="hint">
      Enter = Ohereza • Shift + Enter = Umurongo mushya
    </div>

  </div>


  <script>

    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");

    let currentChat = [];

    let chatHistory =
      JSON.parse(localStorage.getItem("mpaAIHistory") || "[]");


    function saveHistory() {

      localStorage.setItem(
        "mpaAIHistory",
        JSON.stringify(chatHistory)
      );

    }


    function handleKeyDown(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

      }

    }


    function addMessage(type, text) {

      const row = document.createElement("div");

      row.className = "message-row " + type;

      const avatar = document.createElement("div");

      avatar.className = "avatar";

      avatar.textContent =
        type === "user" ? "👤" : "🤖";

      const message = document.createElement("div");

      message.className = "message";

      message.textContent = text;

      row.appendChild(avatar);

      row.appendChild(message);

      chat.appendChild(row);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return message;

    }


    function addTyping() {

      const row = document.createElement("div");

      row.className = "message-row ai";

      row.id = "typing-message";

      const avatar = document.createElement("div");

      avatar.className = "avatar";

      avatar.textContent = "🤖";

      const message = document.createElement("div");

      message.className = "message";

      message.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      row.appendChild(avatar);

      row.appendChild(message);

      chat.appendChild(row);

    }


    function removeTyping() {

      const typing =
        document.getElementById("typing-message");

      if (typing) {
        typing.remove();
      }

    }


    async function sendMessage() {

      const question = input.value.trim();

      if (!question || sendButton.disabled) {
        return;
      }

      const welcome =
        document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      addMessage("user", question);

      currentChat.push({
        role: "user",
        content: question
      });

      input.value = "";

      input.style.height = "auto";

      sendButton.disabled = true;

      addTyping();

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: question
          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "Habaye ikibazo."
          );

        }


        removeTyping();


        const answer =
          data.answer ||
          "Ntabwo nabashije kubona igisubizo.";


        addMessage("ai", answer);


        currentChat.push({
          role: "assistant",
          content: answer
        });


        saveCurrentChat();


      } catch (error) {

        removeTyping();

        addMessage(
          "ai",
          "Habaye ikibazo: " + error.message
        );

      }


      sendButton.disabled = false;

      input.focus();

    }


    function saveCurrentChat() {

      if (currentChat.length === 0) {
        return;
      }


      const firstMessage =
        currentChat.find(
          message => message.role === "user"
        );


      const title =
        firstMessage
          ? firstMessage.content.substring(0, 35)
          : "New Chat";


      const existingIndex =
        chatHistory.findIndex(
          chat => chat.id === currentChat.id
        );


      const chatObject = {
        id: currentChat.id,
        title: title,
        messages: currentChat.messages
      };


      if (existingIndex !== -1) {

        chatHistory[existingIndex] =
          chatObject;

      } else {

        chatHistory.unshift(chatObject);

      }


      saveHistory();

      renderHistory();

    }


    function openHistory() {

      document
        .getElementById("historyPanel")
        .classList.add("open");

      document
        .getElementById("overlay")
        .classList.add("show");

      renderHistory();

    }


    function closeHistory() {

      document
        .getElementById("historyPanel")
        .classList.remove("open");

      document
        .getElementById("overlay")
        .classList.remove("show");

    }


    function renderHistory() {

      const list =
        document.getElementById("historyList");

      list.innerHTML = "";


      if (chatHistory.length === 0) {

        list.innerHTML =
          `<p style="color:#6b7280;font-size:13px;text-align:center;">
            Nta biganiro birabikwa.
          </p>`;

        return;

      }


      chatHistory.forEach((savedChat) => {

        const button =
          document.createElement("button");

        button.className = "history-item";

        button.textContent =
          savedChat.title;


        button.onclick = () => {

          loadChat(savedChat);

          closeHistory();

        };


        list.appendChild(button);

      });

    }


    function loadChat(savedChat) {

      chat.innerHTML = "";

      currentChat = savedChat.messages || [];

      currentChat.forEach(message => {

        addMessage(
          message.role === "user"
            ? "user"
            : "ai",
          message.content
        );

      });

    }


    function newChat() {

      chat.innerHTML = `
        <div class="welcome" id="welcome">

          <div class="welcome-icon">
            🤖
          </div>

          <h2>Murakaza neza kuri Mpa AI</h2>

          <p>
            Baza ikibazo cyawe. Mpa AI ishobora kuganira nawe
            mu Kinyarwanda, English cyangwa Swahili.
          </p>

        </div>
      `;


      currentChat = [];

      input.value = "";

      input.focus();

      closeHistory();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    input.addEventListener(
      "input",
      function () {

        this.style.height = "auto";

        this.style.height =
          Math.min(
            this.scrollHeight,
            130
          ) + "px";

      }
    );


    renderHistory();

  </script>

</body>
</html>
