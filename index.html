<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">

  <title>Mpa AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #252b3a;
      padding: 15px;
    }

    .header-inner {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #6c5ce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .brand-text h1 {
      font-size: 19px;
    }

    .brand-text p {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 3px;
    }

    .new-chat {
      background: #151b28;
      border: 1px solid #30384a;
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .new-chat:hover {
      background: #20283a;
    }

    .chat {
      max-width: 850px;
      margin: auto;
      padding: 25px 15px 145px;
    }

    .welcome {
      text-align: center;
      padding: 70px 15px 35px;
    }

    .welcome-icon {
      width: 70px;
      height: 70px;
      margin: auto auto 20px;
      border-radius: 22px;
      background: #6c5ce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .welcome h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9ca3af;
      line-height: 1.6;
      max-width: 500px;
      margin: auto;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
      gap: 10px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      background: #6c5ce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .user .avatar {
      order: 2;
      background: #252b3a;
    }

    .message {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai .message {
      background: #151b28;
      border: 1px solid #252b3a;
      border-top-left-radius: 5px;
    }

    .user .message {
      background: #6c5ce7;
      border-top-right-radius: 5px;
    }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(11, 15, 25, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid #252b3a;
      padding: 12px 15px 15px;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #151b28;
      border: 1px solid #30384a;
      border-radius: 17px;
      padding: 7px;
    }

    textarea {
      flex: 1;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      resize: none;
      padding: 10px;
      font-size: 16px;
      line-height: 1.5;
      max-height: 130px;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .send-button {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      border: none;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-button:hover {
      opacity: 0.9;
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      max-width: 850px;
      margin: 7px auto 0;
      text-align: center;
      color: #6b7280;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .brand-text h1 {
        font-size: 17px;
      }

      .welcome {
        padding-top: 55px;
      }

      .welcome h2 {
        font-size: 25px;
      }

      .message {
        max-width: 84%;
      }

      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }

      .new-chat {
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <div class="brand">
        <div class="logo">🤖</div>

        <div class="brand-text">
          <h1>Mpa AI</h1>
          <p>AI yawe • Kinyarwanda • English • Swahili</p>
        </div>
      </div>

      <button class="new-chat" onclick="newChat()">
        + New Chat
      </button>

    </div>
  </header>


  <main class="chat" id="chat">

    <div class="welcome" id="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h2>Murakaza neza kuri Mpa AI</h2>

      <p>
        Baza ikibazo cyawe. Mpa AI ishobora kuganira nawe
        mu Kinyarwanda, English cyangwa Swahili.
      </p>

    </div>

  </main>


  <div class="input-area">

    <div class="input-box">

      <textarea
        id="question"
        rows="1"
        placeholder="Andika ikibazo hano..."
        onkeydown="handleKeyDown(event)"
      ></textarea>

      <button
        class="send-button"
        id="sendButton"
        type="button"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

    <div class="hint">
      Enter = Ohereza • Shift + Enter = Umurongo mushya
    </div>

  </div>


  <script>

    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");

    function handleKeyDown(event) {

      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }

    }


    function addMessage(type, text) {

      const row = document.createElement("div");
      row.className = "message-row " + type;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = type === "user" ? "👤" : "🤖";

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = text;

      row.appendChild(avatar);
      row.appendChild(message);

      chat.appendChild(row);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return message;
    }


    function addTyping() {

      const row = document.createElement("div");
      row.className = "message-row ai";
      row.id = "typing-message";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🤖";

      const message = document.createElement("div");
      message.className = "message";

      message.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      row.appendChild(avatar);
      row.appendChild(message);

      chat.appendChild(row);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }


    function removeTyping() {

      const typing = document.getElementById("typing-message");

      if (typing) {
        typing.remove();
      }

    }


    async function sendMessage() {

      const question = input.value.trim();

      if (!question || sendButton.disabled) {
        return;
      }

      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      addMessage("user", question);

      input.value = "";
      input.style.height = "auto";

      sendButton.disabled = true;

      addTyping();

      try {

        const response = await fetch("/api/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: question
          })
        });


        const data = await response.json();


        if (!response.ok) {
          throw new Error(
            data.error || "Habaye ikibazo."
          );
        }


        removeTyping();

        addMessage(
          "ai",
          data.answer || "Ntabwo nabashije kubona igisubizo."
        );


      } catch (error) {

        removeTyping();

        addMessage(
          "ai",
          "Habaye ikibazo: " + error.message
        );

      }


      sendButton.disabled = false;

      input.focus();

    }


    function newChat() {

      chat.innerHTML = `
        <div class="welcome" id="welcome">

          <div class="welcome-icon">
            🤖
          </div>

          <h2>Murakaza neza kuri Mpa AI</h2>

          <p>
            Baza ikibazo cyawe. Mpa AI ishobora kuganira nawe
            mu Kinyarwanda, English cyangwa Swahili.
          </p>

        </div>
      `;

      input.value = "";
      input.focus();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    input.addEventListener("input", function () {

      this.style.height = "auto";

      this.style.height =
        Math.min(this.scrollHeight, 130) + "px";

    });

  </script>

</body>
</html>
