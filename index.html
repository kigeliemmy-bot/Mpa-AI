<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mpa AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #252b3a;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      color: #9ca3af;
      margin-top: 6px;
    }

    .chat {
      max-width: 700px;
      margin: auto;
      padding: 25px 15px 120px;
    }

    .welcome {
      text-align: center;
      margin: 80px 0 30px;
    }

    .welcome h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9ca3af;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0b0f19;
      padding: 15px;
      border-top: 1px solid #252b3a;
    }

    .input-box {
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: #151b28;
      color: white;
      border: 1px solid #30384a;
      border-radius: 14px;
      padding: 14px;
      resize: none;
      outline: none;
      font-size: 16px;
    }

    button {
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .message {
      background: #151b28;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 Mpa AI</h1>
    <p>AI ivuga Kinyarwanda</p>
  </header>

  <main class="chat" id="chat">
    <div class="welcome">
      <h2>Murakaza neza kuri Mpa AI</h2>
      <p>Andika ikibazo cyawe mu Kinyarwanda cyangwa English.</p>
    </div>
  </main>

  <div class="input-area">
    <div class="input-box">
      <textarea id="question" rows="2"
        placeholder="Andika ikibazo hano..."></textarea>
      <button onclick="sendMessage()">Ohereza</button>
    </div>
  </div>

  <script>
    
async function sendMessage() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const question = input.value.trim();

  if (!question) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message";
  userMessage.textContent = "Wowe: " + question;
  chat.appendChild(userMessage);

  const aiMessage = document.createElement("div");
  aiMessage.className = "message";
  aiMessage.textContent = "Mpa AI: Ndimo gutekereza...";
  chat.appendChild(aiMessage);

  input.value = "";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Habaye ikibazo.");
    }

    aiMessage.textContent = "Mpa AI: " + data.answer;
  } catch (error) {
    aiMessage.textContent =
      "Mpa AI: Habaye ikibazo. Ongera ugerageze.";
  }

  window.scrollTo(0, document.body.scrollHeight);
}
      
  </script>

</body>
</html>
