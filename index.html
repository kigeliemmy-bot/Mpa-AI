<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mpa AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: #111827;
      color: white;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .new-chat:hover {
      background: #374151;
    }

    .history-title {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    #history {
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 5px;
      font-size: 14px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: #1f2937;
    }

    .empty-history {
      color: #6b7280;
      font-size: 13px;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      display: none;
      border: none;
      background: transparent;
      font-size: 24px;
      cursor: pointer;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      max-width: 700px;
      margin: 70px auto;
      text-align: center;
    }

    .welcome-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .welcome p {
      color: #6b7280;
      font-size: 16px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
      gap: 10px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #111827;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .sender {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    /* INPUT */
    .input-area {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 14px 20px;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 13px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #111827;
    }

    .send-btn {
      width: 50px;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      max-width: 850px;
      margin: 7px auto 0;
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #6b7280;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: .3;
      }

      40% {
        opacity: 1;
      }
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        left: -290px;
        top: 0;
        bottom: 0;
        transition: left .2s;
      }

      .sidebar.open {
        left: 0;
      }

      .menu-btn {
        display: block;
      }

      .chat {
        padding: 15px;
      }

      .bubble {
        max-width: 88%;
      }

      .welcome {
        margin: 50px auto;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .input-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history-title">
      💬 Chat History
    </div>

    <div id="history"></div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="header">

      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      <div>
        <div class="logo">
          🤖 Mpa AI
        </div>

        <div class="subtitle">
          AI yawe • Kinyarwanda • English • Swahili
        </div>
      </div>

    </header>

    <!-- CHAT -->
    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h1>
          Murakaza neza kuri Mpa AI
        </h1>

        <p>
          Baza ikibazo icyo ari cyo cyose.
          Mpa AI iragusubiza mu Kinyarwanda, English cyangwa Swahili.
        </p>

      </div>

    </section>

    <!-- INPUT -->
    <footer class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Andika ikibazo cyawe..."
          rows="1"
        ></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

      <div class="hint">
        Enter = Ohereza • Shift + Enter = Umurongo mushya
      </div>

    </footer>

  </main>

</div>

<script>

  // =====================================================
  // STATE
  // =====================================================

  let currentMessages = [];
  let currentChatId = null;

  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const history = document.getElementById("history");
  const sidebar = document.getElementById("sidebar");


  // =====================================================
  // CHAT HISTORY
  // =====================================================

  function getHistory() {

    try {

      return JSON.parse(
        localStorage.getItem("mpa_ai_history") || "[]"
      );

    } catch {

      return [];

    }

  }


  function saveHistory() {

    localStorage.setItem(
      "mpa_ai_history",
      JSON.stringify(getHistory())
    );

  }


  function renderHistory() {

    const chats = getHistory();

    history.innerHTML = "";

    if (!chats.length) {

      history.innerHTML =
        '<div class="empty-history">Nta biganiro bibikwa.</div>';

      return;

    }

    chats
      .slice()
      .reverse()
      .forEach(item => {

        const div = document.createElement("div");

        div.className = "history-item";

        div.textContent =
          item.title || "New Chat";

        div.onclick = () => loadChat(item.id);

        history.appendChild(div);

      });

  }


  function saveCurrentChat() {

    if (!currentMessages.length) {
      return;
    }

    const chats = getHistory();

    if (!currentChatId) {

      currentChatId =
        Date.now().toString();

    }

    const firstUserMessage =
      currentMessages.find(
        m => m.role === "user"
      );

    const title =
      firstUserMessage
        ? firstUserMessage.content.substring(0, 35)
        : "New Chat";

    const existingIndex =
      chats.findIndex(
        c => c.id === currentChatId
      );

    const chatObject = {

      id: currentChatId,

      title: title,

      messages: currentMessages

    };

    if (existingIndex >= 0) {

      chats[existingIndex] =
        chatObject;

    } else {

      chats.push(chatObject);

    }

    localStorage.setItem(
      "mpa_ai_history",
      JSON.stringify(chats)
    );

    renderHistory();

  }


  function loadChat(id) {

    const chats = getHistory();

    const selected =
      chats.find(c => c.id === id);

    if (!selected) {
      return;
    }

    currentChatId = selected.id;

    currentMessages =
      selected.messages || [];

    chat.innerHTML = "";

    currentMessages.forEach(message => {

      addMessageToUI(
        message.role,
        message.content
      );

    });

    sidebar.classList.remove("open");

  }


  function newChat() {

    currentMessages = [];

    currentChatId = null;

    chat.innerHTML = `

      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h1>
          Murakaza neza kuri Mpa AI
        </h1>

        <p>
          Baza ikibazo icyo ari cyo cyose.
          Mpa AI iragusubiza mu Kinyarwanda, English cyangwa Swahili.
        </p>

      </div>

    `;

    input.value = "";

    sidebar.classList.remove("open");

  }


  // =====================================================
  // UI MESSAGE
  // =====================================================

  function addMessageToUI(role, content) {

    const welcome =
      document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " +
      (role === "user"
        ? "user"
        : "assistant");

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";

    const sender =
      document.createElement("div");

    sender.className = "sender";

    sender.textContent =
      role === "user"
        ? "Wowe"
        : "Mpa AI";

    const text =
      document.createElement("div");

    text.textContent = content;

    bubble.appendChild(sender);

    bubble.appendChild(text);

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop =
      chat.scrollHeight;

  }


  // =====================================================
  // TYPING
  // =====================================================

  function showTyping() {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message assistant";

    wrapper.id =
      "typingMessage";

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";

    bubble.innerHTML = `

      <div class="sender">
        Mpa AI
      </div>

      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

    `;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop =
      chat.scrollHeight;

  }


  function removeTyping() {

    const typing =
      document.getElementById(
        "typingMessage"
      );

    if (typing) {
      typing.remove();
    }

  }


  // =====================================================
  // SEND MESSAGE
  // =====================================================

  async function sendMessage() {

    const message =
      input.value.trim();

    if (!message || sendBtn.disabled) {
      return;
    }

    input.value = "";

    input.style.height =
      "48px";

    addMessageToUI(
      "user",
      message
    );

    currentMessages.push({

      role: "user",

      content: message

    });

    saveCurrentChat();

    sendBtn.disabled = true;

    showTyping();

    try {

      /*
       * IMPORTANT:
       * The browser sends the request to the SAME
       * Worker that served this page.
       */

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: message
            })
          }
        );


      /*
       * First check whether the Worker actually
       * returned JSON.
       */

      const contentType =
        response.headers.get(
          "content-type"
        ) || "";


      if (!contentType.includes("application/json")) {

        const raw =
          await response.text();

        console.error(
          "Mpa AI returned non-JSON:",
          raw
        );

        throw new Error(
          "Server returned HTML instead of JSON."
        );

      }


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.response ||
          "Server error"
        );

      }


      const answer =
        data.response ||
        "Mbabarira, nta gisubizo nabonye.";


      removeTyping();

      addMessageToUI(
        "assistant",
        answer
      );


      currentMessages.push({

        role: "assistant",

        content: answer

      });

      saveCurrentChat();


    } catch (error) {

      console.error(error);

      removeTyping();

      const errorMessage =
        "Habaye ikibazo cyo kuvugana na Mpa AI. Ongera ugerageze.";

      addMessageToUI(
        "assistant",
        errorMessage
      );

      currentMessages.push({

        role: "assistant",

        content: errorMessage

      });

      saveCurrentChat();

    }


    sendBtn.disabled = false;

    input.focus();

  }


  // =====================================================
  // ENTER / SHIFT + ENTER
  // =====================================================

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  // =====================================================
  // AUTO RESIZE TEXTAREA
  // =====================================================

  input.addEventListener(
    "input",
    function() {

      this.style.height =
        "auto";

      this.style.height =
        Math.min(
          this.scrollHeight,
          140
        ) + "px";

    }
  );


  // =====================================================
  // MOBILE SIDEBAR
  // =====================================================

  function toggleSidebar() {

    sidebar.classList.toggle(
      "open"
    );

  }


  // =====================================================
  // START
  // =====================================================

  renderHistory();

  input.focus();

</script>

</body>
</html>
